<title>Oscar's Music</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: slim top bar, one centered column (max 880px) switching between list, detail and plan views; a persistent mini-brand, A-Z rail beside lists. */
:root{
  --bg:#f2f5f6; --surface:#ffffff; --sunk:#e6ecee; --ink:#13232b; --muted:#5b6b73; --line:#d3dcdf;
  --accent:#0e6f73; --accent-ink:#ffffff; --accent-soft:#d6ecec; --warn:#a85a00; --warn-soft:#fbe9cf;
  --f-display:'Bricolage Grotesque','Trebuchet MS',sans-serif;
  --f-body:'Source Sans 3','Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1a1f; --surface:#17262d; --sunk:#0b1418; --ink:#e6eef0; --muted:#97a9b0; --line:#2a3d46;
  --accent:#4cc3c4; --accent-ink:#062325; --accent-soft:#16393c; --warn:#f0b35f; --warn-soft:#3a2a10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a1f; --surface:#17262d; --sunk:#0b1418; --ink:#e6eef0; --muted:#97a9b0; --line:#2a3d46;
  --accent:#4cc3c4; --accent-ink:#062325; --accent-soft:#16393c; --warn:#f0b35f; --warn-soft:#3a2a10; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2rem} h2{font-size:1.35rem} h3{font-size:1.05rem}
.muted{color:var(--muted)} .small{font-size:.875rem}
.label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.25rem;letter-spacing:-.01em;background:none;border:0;padding:0;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:50%;background:var(--accent);display:inline-block;box-shadow:inset -6px -4px 0 rgba(0,0,0,.18)}
nav{display:flex;gap:4px;flex:1;min-width:0}
nav button,.seg button{background:none;border:0;padding:6px 12px;border-radius:6px;color:var(--muted);font-weight:600}
nav button[aria-current="true"],.seg button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.role{display:flex;align-items:center;gap:8px;font-size:.875rem}
.switch{width:38px;height:22px;border-radius:11px;border:1px solid var(--line);background:var(--sunk);position:relative;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(16px);background:var(--accent-ink)}
.mock{background:var(--warn-soft);color:var(--warn);font-size:.8125rem;padding:6px 0}

main{padding-block:28px 64px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.search{position:relative;flex:1;min-width:220px;max-width:420px}
.search input{width:100%;padding:10px 12px 10px 38px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:4px 10px;font-size:.875rem}
.btn.danger{color:var(--warn)}
.admin-only{display:none} body.admin .admin-only{display:inline-flex}
body.admin div.admin-only{display:flex;flex-wrap:wrap}

.cover{aspect-ratio:1;border-radius:6px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:#fff;flex:none;overflow:hidden;background-size:cover;background-position:center}
.cover.none{background:var(--sunk);color:var(--muted);border:1px dashed var(--line)}
.list-wrap{display:grid;grid-template-columns:1fr 28px;gap:12px;align-items:start}
.az{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;flex-direction:column;font-size:.7rem;font-weight:600;text-align:center;color:var(--muted)}
.az a{padding:1px 0;text-decoration:none;color:inherit} .az a.off{opacity:.3;pointer-events:none}
.letter{font-family:var(--f-display);font-size:1.1rem;color:var(--accent);padding:14px 0 4px;border-bottom:1px solid var(--line);scroll-margin-top:90px}
.row{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 4px}
.row:hover{background:var(--accent-soft)}
.row .cover{width:48px;font-size:1.1rem}
.row .meta{flex:1;min-width:0}
.row .title{font-weight:600;overflow-wrap:anywhere}
.row .by{font-size:.875rem;color:var(--muted);overflow-wrap:anywhere}
.tags{display:flex;gap:6px;flex:none}
.tag{font-size:.7rem;font-weight:600;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted)}
mark{background:var(--warn-soft);color:inherit;border-radius:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:20px}
.card{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:8px}
.card .cover{width:100%;font-size:2.4rem}
.card:hover .title{color:var(--accent)}
.empty{padding:40px 0;text-align:center;color:var(--muted)}

.detail-head{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:22px}
.detail-head .cover{width:min(200px,100%);font-size:3.4rem}
.detail-head .info{flex:1;min-width:240px;display:flex;flex-direction:column;gap:10px}
dl.credits{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;margin:0}
dl.credits dt{color:var(--muted);font-size:.875rem} dl.credits dd{margin:0}
.note{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);padding:10px 14px;border-radius:0 8px 8px 0}
.back{background:none;border:0;color:var(--accent);font-weight:600;padding:0;margin-bottom:14px}

.player{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:24px}
.player .play{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.player .track{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
input[type=range]{width:100%;accent-color:var(--accent)}
.time{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between}
.player.off{background:var(--sunk);color:var(--muted);border-style:dashed}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 18px;font-weight:600;color:var(--muted);margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.lyrics{white-space:pre-wrap;max-width:65ch;font-size:1.1rem;line-height:1.75}
.lyrics .sec{display:block;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-top:18px}
pre.chords{font-family:var(--f-mono);font-size:.95rem;line-height:1.55;overflow-x:auto;margin:0;max-width:100%}
pre.chords b{color:var(--accent);font-weight:500}
.score{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto}
.score svg{display:block;min-width:620px;width:100%}
.placeholder{border:1px dashed var(--line);border-radius:8px;padding:28px;text-align:center;color:var(--muted)}

.tracks{list-style:none;padding:0;margin:0}
.tracks li{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:8px 0}
.tracks .n{width:24px;font-family:var(--f-mono);color:var(--muted);text-align:right}
.tracks .cover{width:40px;font-size:1rem}
.tracks .go{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0}
.tracks .ctl{display:none;gap:4px} body.admin .tracks .ctl{display:flex}
.ib{width:30px;height:30px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:0}
.ib:disabled{opacity:.35;cursor:default}

form.f{display:grid;gap:16px;max-width:640px}
form.f label{display:grid;gap:4px;font-weight:600}
form.f label span.hint{font-weight:400;color:var(--muted);font-size:.875rem}
form.f input[type=text],form.f input[type=url],form.f input[type=email],form.f input[type=date],form.f input[type=time],form.f textarea,form.f select{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:100%;font-weight:400}
form.f textarea{min-height:110px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:560px){.two{grid-template-columns:1fr}.tags{display:none}}
.drop{border:1px dashed var(--line);border-radius:8px;padding:12px;font-weight:400;display:flex;gap:12px;align-items:center;background:var(--surface)}
.drop .cover{width:56px}

/* Links, calendar, contact */
.links{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-weight:600;font-size:.875rem;text-decoration:none;color:var(--ink)}
a.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.amts{display:flex;gap:8px;flex-wrap:wrap}
.event{display:flex;gap:16px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.event .date{width:52px;flex:none;text-align:center;background:var(--accent-soft);border-radius:8px;padding:6px 0;display:flex;flex-direction:column;line-height:1.1}
.event .date b{font-family:var(--f-display);font-size:1.5rem;color:var(--accent)} .event .date span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.event .what{flex:1;min-width:0} .evtop{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.event .by{color:var(--muted);font-size:.9rem}
.event .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
a.btn{text-decoration:none;display:inline-block;color:var(--ink)}
@media(max-width:560px){.event{flex-wrap:wrap}.event .acts{width:100%;justify-content:flex-start;padding-left:68px}}
.reasons{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:26px}
.reason{display:grid;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.reason[aria-checked="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);background:var(--accent-soft)}
.about{display:grid;gap:28px}
.about-grid{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
.portrait{width:min(220px,100%);aspect-ratio:1;border-radius:6px;background:linear-gradient(135deg,hsl(188 55% 38%),hsl(238 60% 55%));color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:3.6rem;flex:none}
.prose{flex:1;min-width:240px;max-width:65ch} .prose p{margin:0 0 14px;font-size:1.05rem}
.lk{display:inline-flex;align-items:center;gap:2px}
.x{border:0;background:none;color:var(--muted);font-size:1.1rem;padding:0 4px}
.lkin{padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0;flex:1;max-width:280px}
/* Plan */
.plan{display:grid;gap:34px}
.plan section{display:grid;gap:12px}
.plan p{margin:0;max-width:70ch}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:6px;align-content:start}
.box ul,.plan ul{margin:0;padding-left:18px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td code,.plan code{font-family:var(--f-mono);font-size:.85em;background:var(--sunk);padding:1px 5px;border-radius:4px}
.phase{display:grid;grid-template-columns:96px 1fr;gap:6px 18px;padding:14px 0;border-top:1px solid var(--line)}
.phase .when{font-family:var(--f-mono);font-size:.85rem;color:var(--accent)}
@media(max-width:560px){.phase{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top"><div class="wrap bar">
  <button class="brand" data-act="go" data-v="songs"><i></i>Oscar's Music</button>
  <nav aria-label="Main">
    <button data-act="go" data-v="songs" id="n-songs">Songs</button>
    <button data-act="go" data-v="collections" id="n-collections">Collections</button>
    <button data-act="go" data-v="calendar" id="n-calendar">Calendar</button>
    <button data-act="go" data-v="about" id="n-about">About</button>
    <button data-act="go" data-v="contact" id="n-contact">Contact</button>
  </nav>
  <div class="role"><span id="roleLabel">Listener view</span>
    <button class="switch" role="switch" aria-checked="false" aria-label="Preview as admin" data-act="role"></button></div>
  <button class="btn primary" data-act="book">Book Oscar</button>
</div></header>
<div class="mock"><div class="wrap"><b>Mockup.</b> Songs, names and lyrics are made-up samples. Use the switch to preview what admins see. The audio player is simulated.</div></div>
<main class="wrap" id="app"></main>

<script>
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const HUES=[188,24,262,340,142,48,210,8];

let songs=[
 {id:1,links:[{t:'YouTube',u:'https://www.youtube.com/'},{t:'Spotify',u:'https://open.spotify.com/'}],title:'Harbour Lights',lw:['Oscar Nash','Mira Delaney'],mw:['Oscar Nash'],len:214,audio:true,score:true,img:true,hue:0,key:'G major',

  chords:[["G            D/F#          Em","The harbour lights come on one by one"],["C              G/B          Am   D","As the last boat turns for home"],["G            D/F#          Em","I count the windows along the quay"],["C              D            G","And none of them are mine alone"],["","" ],["C         G          D","So leave a light on for the ones at sea"],["C         G          Em  D","Leave a light on for me"]]},
 {id:2,links:[{t:'Apple Music',u:'https://music.apple.com/'}],title:'Amber Fields',lw:['Oscar Nash'],mw:['Oscar Nash','Tomas Wren'],len:187,audio:true,score:false,img:true,hue:1,key:'D major',note:'Harvest song. Works well with a shaker and two-part harmony in the chorus.',
  lyrics:"[Verse 1]\nWheat is bowing to the wind\nGold as an old coin\nWe walk the rows at the end of day\nWith the whole sky for a roof\n\n[Chorus]\nAmber fields, amber fields\nHold the light a little longer",chords:[["D          A/C#        Bm","Wheat is bowing to the wind"],["G           D/F#       A","Gold as an old coin"]]},
 {id:3,links:[{t:'YouTube',u:'https://www.youtube.com/'},{t:'Spotify',u:'https://open.spotify.com/'},{t:'Apple Music',u:'https://music.apple.com/'}],title:'Between the Rooms',lw:['Priya Nair'],mw:['Oscar Nash'],len:241,audio:true,score:true,img:false,hue:2,key:'A minor',note:'Priya sent the words in 2021. Oscar set them over a weekend.',

 {id:4,links:[],title:'Bell Tower Waltz',lw:[],mw:['Oscar Nash'],len:156,audio:true,score:true,img:true,hue:3,key:'F major',note:'Instrumental. Three-quarter time.',lyrics:'',chords:[]},
 {id:5,links:[],title:'Cold Water Morning',lw:['Oscar Nash','Tomas Wren'],mw:['Oscar Nash','Tomas Wren'],len:198,audio:false,score:false,img:false,hue:4,key:'E minor',note:'Demo not recorded yet.',lyrics:'',chords:[]},
 {id:6,links:[],title:'Everything Returns',lw:['Mira Delaney'],mw:['Mira Delaney','Oscar Nash'],len:225,audio:true,score:false,img:true,hue:5,key:'C major',note:'',lyrics:'',chords:[]},
 {id:7,links:[],title:'Lantern Song',lw:['Oscar Nash'],mw:['Oscar Nash'],len:172,audio:true,score:true,img:false,hue:6,key:'Bb major',note:'Children\'s choir arrangement available on request.',lyrics:'',chords:[]},
 {id:8,links:[],title:'Salt and Rope',lw:['Priya Nair','Oscar Nash'],mw:['Oscar Nash'],len:203,audio:true,score:false,img:true,hue:7,key:'D minor',note:'',lyrics:'',chords:[]},
 {id:9,links:[],title:'An Open Door',lw:['Oscar Nash'],mw:['Tomas Wren'],len:190,audio:false,score:false,img:false,hue:0,key:'G major',note:'',lyrics:'',chords:[]}
];
let lists=[
 {id:1,title:'Songs of the Sea',img:true,hue:0,note:'Written between 2018 and 2022. Good for an evening set.',links:[],ids:[1,8,7]},
 {id:2,title:'Choir Favourites',img:false,hue:2,note:'Songs the community choir sings most often, in rehearsal order.',links:[],ids:[2,7,3]},
 {id:3,title:'Instrumentals',img:true,hue:3,note:'',links:[],ids:[4]},
 {id:4,title:"Live at St Anne's Hall",img:true,hue:5,note:'Recorded at the evening concert in Bristol, with Mira Delaney on harmony. Sample entry showing a whole-session recording.',links:[{t:'YouTube',u:'https://www.youtube.com/'},{t:'Spotify',u:'https://open.spotify.com/'}],ids:[1,2,3]}
];
let S={reason:'message',view:'songs',id:null,q:'',admin:false,tab:'lyrics',draft:{img:null}};
let nextId=100,timer=null;

const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const sortT=a=>[...a].sort((x,y)=>x.title.replace(/^(the|an?) /i,'').localeCompare(y.title.replace(/^(the|an?) /i,''),undefined,{sensitivity:'base'}));
const sortKey=t=>t.replace(/^(the|an?) /i,'')[0].toUpperCase();
const hl=(t,q)=>{t=esc(t);if(!q)return t;const r=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');return t.replace(r,'<mark>$1</mark>')};
function cover(o,cls=''){
  if(!o.img)return `<div class="cover none ${cls}" aria-hidden="true">${esc(o.title[0])}</div>`;
  const h=HUES[o.hue%8];
  return `<div class="cover ${cls}" aria-hidden="true" style="background:linear-gradient(135deg,hsl(${h} 55% 38%),hsl(${(h+50)%360} 60% 55%))">${esc(o.title[0])}</div>`}
const songBy=s=>[s.lw.length?'Words: '+s.lw.join(', '):'',s.mw.length?'Music: '+s.mw.join(', '):''].filter(Boolean).join(' · ');
const songById=id=>songs.find(s=>s.id===id);

function go(v,id){clearInterval(timer);S.view=v;S.id=id??null;S.tab='lyrics';if(v==='songs'||v==='collections')S.q='';

  document.body.classList.toggle('admin',S.admin);
  $('#roleLabel').textContent=S.admin?'Admin view':'Listener view';
  $('.switch').setAttribute('aria-checked',S.admin);
  const nav={songs:'songs',song:'songs',new:'songs',collections:'collections',collection:'collections',calendar:'calendar',about:'about',contact:'contact'}[S.view];
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.id==='n-'+nav));
  ({songs:vSongs,collections:vLists,song:vSong,collection:vList,new:vNew,calendar:vCal,about:vAbout,contact:vContact})[S.view]();

function searchBox(ph){return `<div class="search"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="5"/><path d="M11 11l4 4"/></svg><input id="q" type="search" placeholder="${ph}" value="${esc(S.q)}" aria-label="${ph}" autocomplete="off"></div>`}
function vSongs(){
  app.innerHTML=`<div class="head"><div><h1>Songs</h1><div class="muted" id="count"></div></div>${searchBox('Search by title or co-writer')}
   <button class="btn primary admin-only" data-act="go" data-v="new">+ Add song</button></div><div id="out"></div>`;
  fillSongs();$('#q').addEventListener('input',e=>{S.q=e.target.value;fillSongs()});
}
function fillSongs(){
  const q=S.q.trim().toLowerCase();
  let list=sortT(songs).filter(s=>!q||[s.title,...s.lw,...s.mw].some(x=>x.toLowerCase().includes(q)));
  $('#count').textContent=q?`${list.length} of ${songs.length} songs match`:`${songs.length} songs, A to Z`;
  if(!list.length){$('#out').innerHTML=`<div class="empty">No songs match “${esc(S.q)}”. Try a title or a co-writer's name.</div>`;return}
  let html='',cur='';const have=new Set();
  for(const s of list){const L=sortKey(s.title);have.add(L);
    if(L!==cur){cur=L;html+=`<div class="letter" id="L${L}">${L}</div>`}
    const who=[...s.lw,...s.mw].filter((x,i,a)=>a.indexOf(x)===i);
    html+=`<button class="row" data-act="song" data-id="${s.id}">${cover(s)}<div class="meta"><div class="title">${hl(s.title,q)}</div>
     <div class="by">${q?hl(songBy(s),q):esc(songBy(s)||'No credits')}</div></div>
     <div class="tags">${s.audio?'<span class="tag">Audio</span>':''}${s.lyrics?'<span class="tag">Lyrics</span>':''}${s.chords.length?'<span class="tag">Chords</span>':''}${s.score?'<span class="tag">Score</span>':''}</div></button>`}
  const rail='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(l=>`<a href="#L${l}" class="${have.has(l)?'':'off'}" data-az="${l}">${l}</a>`).join('');
  $('#out').innerHTML=`<div class="list-wrap"><div>${html}</div><div class="az" aria-label="Jump to letter">${rail}</div></div>`;
}

function scoreSVG(s){
  const y=[30,42,54,66,78];let g='';
  [0,1].forEach(r=>{const o=r*110;y.forEach(v=>g+=`<line x1="20" x2="780" y1="${v+o}" y2="${v+o}" stroke="#222" stroke-width="1"/>`);g+=`<line x1="20" x2="20" y1="${30+o}" y2="${78+o}" stroke="#222"/><text x="26" y="${72+o}" font-size="54" fill="#222" font-family="serif">&#119070;</text>`;
   for(let i=0;i<8;i++){const x=110+i*82,yy=[78,66,60,54,60,66,48,54][(i+r*3)%8]+o;g+=`<ellipse cx="${x}" cy="${yy}" rx="6" ry="4.5" fill="#222" transform="rotate(-15 ${x} ${yy})"/><line x1="${x+5.5}" x2="${x+5.5}" y1="${yy}" y2="${yy-30}" stroke="#222"/>`;if(i%4==3)g+=`<line x1="${x+40}" x2="${x+40}" y1="${30+o}" y2="${78+o}" stroke="#222"/>`}});
  return `<div class="score"><svg viewBox="0 0 800 230" role="img" aria-label="Sample score for ${esc(s.title)}">${g}</svg></div><p class="small muted">Sample engraving. The real app shows the uploaded PDF or image of the score, for viewing only; there is no download.</p>`}

     <div class="note small">The Donate button opens a secure payment page run by a payment provider. This site never sees or stores card details.</div>`,
   message:''}[r];
  const msgLabel={booking:'Tell us more',play:'Tell us about your idea',donate:'Add a message for Oscar (optional)',message:'Your message'}[r];
  app.innerHTML=`<div class="head"><div><h1>Contact Oscar</h1><div class="muted">Choose what you'd like to do.</div></div></div>
  <div class="reasons" role="radiogroup" aria-label="Reason for contact">${REASONS.map(([k,n,d])=>`<button class="reason" role="radio" aria-checked="${k===r}" data-act="reason" data-r="${k}"><b>${n}</b><span class="small muted">${d}</span></button>`).join('')}</div>
  <div id="cform"><form class="f" id="cf">
   ${r==='donate'?'':`<div class="two">${field('c-name','Your name','','text',true)}${field('c-email','Email address','','email',true)}</div>`}
   ${extra}
   <label>${msgLabel}<textarea id="c-msg" ${r==='message'?'required':''}></textarea></label>
   <div><button class="btn primary" type="submit">${{booking:'Send booking enquiry',play:'Send my idea',donate:'Donate',message:'Send message'}[r]}</button></div>
  </form></div>`;
  $('#cf').addEventListener('submit',e=>{e.preventDefault();
   $('#cform').innerHTML=`<div class="note"><h3>${r==='donate'?'Thank you for thinking of this':'Thanks, your message is ready to go'}</h3><p style="margin:6px 0 0">${r==='donate'?'In the live site this opens the secure payment page.':'In the live site this reaches Oscar by email, and you would get a confirmation. This mockup does not send anything.'}</p></div>`});
}

/* ---------- Events ---------- */
function togglePlay(){
  S.playing=!S.playing;const s=songById(S.id);
  $('#pi').innerHTML=S.playing?'<path d="M4 2h3.5v14H4zM10.5 2H14v14h-3.5z"/>':'<path d="M4 2l12 7-12 7z"/>';
  clearInterval(timer);
  if(S.playing)timer=setInterval(()=>{S.pos=Math.min(s.len,S.pos+1);$('#seek').value=S.pos;$('#cur').textContent=fmt(S.pos);if(S.pos>=s.len){togglePlay();S.pos=0}},1000);
}
document.addEventListener('click',e=>{
  const az=e.target.closest('[data-az]');if(az){e.preventDefault();const t=document.getElementById('L'+az.dataset.az);t&&t.scrollIntoView({behavior:'smooth'});return}
  const el=e.target.closest('[data-act]');if(!el)return;const d=el.dataset;
  const p=lists.find(x=>x.id===S.id);
  switch(d.act){
   case 'go':e.preventDefault();go(d.v);break;
   case 'song':go('song',+d.id);break;
   case 'list':e.preventDefault();S.view='collection';S.id=+d.id;clearInterval(timer);render();window.scrollTo(0,0);break;
   case 'role':S.admin=!S.admin;about.editing=false;render();break;
   case 'play':togglePlay();break;
   case 'tab':S.tab=d.t;document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===d.t));
     document.querySelectorAll('.pane').forEach(x=>x.hidden=x.id!=='p-'+d.t);break;
   case 'mv':{const i=+d.i,j=i+ +d.d;[p.ids[i],p.ids[j]]=[p.ids[j],p.ids[i]];render();break}
   case 'rm':p.ids.splice(+d.i,1);render();break;
   case 'add':{const v=$('#addsel').value;if(v){p.ids.push(+v);render()}break}
   case 'newlist':{const id=nextId++;lists.push({id,title:'New collection',img:false,hue:id%8,note:'',links:[],ids:[]});S.view='collection';S.id=id;render();break}
   case 'delsong':songs=songs.filter(s=>s.id!==+d.id);lists.forEach(l=>l.ids=l.ids.filter(i=>i!==+d.id));go('songs');break;
   case 'dellist':lists=lists.filter(l=>l.id!==+d.id);go('collections');break;
   case 'book':e.preventDefault();S.reason='booking';go('contact');break;
   case 'reason':S.reason=d.r;vContact();break;
   case 'amt':document.querySelectorAll('#amts .chip').forEach(c=>c.setAttribute('aria-pressed',c===el));break;
   case 'delev':events=events.filter(x=>x.id!==+d.id);vCal();break;
   case 'addcol':{const q=lists.find(x=>x.id===+$('#addcol').value);if(q&&!q.ids.includes(+d.id)){q.ids.push(+d.id);vSong()}break}
   case 'addlink':{const u=$('#lk-u').value.trim();if(u&&p){p.links.push({t:$('#lk-t').value,u});vList()}break}
   case 'rmlink':p.links.splice(+d.i,1);vList();break;
   case 'aboutedit':about.editing=!about.editing;vAbout();break;
   case 'aboutnoimg':about.title=$('#a-title').value;about.tag=$('#a-tag').value;about.body=$('#a-body').value;about.img=null;vAbout();break;
   case 'stub':el.textContent='Opens an edit form in the real app';el.disabled=true;break;
  }
});
const h=location.hash.slice(1);if(['calendar','contact','about','collections'].includes(h))S.view=h;
render();
</script>
